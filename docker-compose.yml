# audio-jam: audio -> drums -> MIDI -> MusicXML/PDF
# Default service is CPU-only (runs anywhere). GPU is an optional profile.
services:
  # ---- CPU (default). Works with no GPU / no nvidia-container-toolkit. ----
  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile.base
      args:
        TORCH_VARIANT: cpu
        # set these only if github is blocked in your network:
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
    image: audiojam-base:cpu
    environment:
      DEVICE: cpu
    volumes:
      - ./data:/data
    # override input per run:
    #   docker compose run --rm pipeline --input /data/input/song.wav --outdir /data/output
    command: [--input, /data/input/test_drums.wav, --outdir, /data/output, --device, cpu]

  # ---- WebUI (CPU). Upload audio, watch progress, preview score, import MIDI/MusicXML. ----
  #   BUILD_PROXY=http://172.20.128.1:20808 docker compose build web
  #   docker compose up web       then open http://localhost:8080
  web:
    build:
      context: ./pipeline
      dockerfile: Dockerfile.base
      args:
        TORCH_VARIANT: cpu
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
    image: audiojam-base:cpu
    environment:
      DEVICE: cpu
      DATA_ROOT: /data
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    entrypoint: ["uvicorn", "webapp:app", "--host", "0.0.0.0", "--port", "8080"]

  # ---- GPU (optional). Requires nvidia-container-toolkit on host. ----
  # Uses the official pytorch CUDA image (torch pre-baked) to avoid huge wheel downloads.
  #   BUILD_PROXY=http://172.20.128.1:20808 docker compose --profile gpu build
  #   docker compose --profile gpu run --rm pipeline-gpu --input /data/input/song.mp3
  pipeline-gpu:
    profiles: [gpu]
    build:
      context: ./pipeline
      dockerfile: Dockerfile.gpu
      args:
        PIP_PROXY: ${BUILD_PROXY:-}
    image: audiojam-base:gpu
    environment:
      DEVICE: cuda
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: [--input, /data/input/test_drums.wav, --outdir, /data/output, --device, cuda]

  # ---- WebUI on GPU ----
  #   docker compose --profile gpu up -d web-gpu   then open http://localhost:8080
  web-gpu:
    profiles: [gpu]
    build:
      context: ./pipeline
      dockerfile: Dockerfile.gpu
      args:
        PIP_PROXY: ${BUILD_PROXY:-}
    image: audiojam-base:gpu
    # Select the nvidia runtime explicitly. daemon.json registers it but does not set
    # it as default, and `deploy...devices` alone then silently yields no GPU inside
    # the container (torch.cuda.is_available()=False -> pipeline falls back to -d cpu).
    runtime: nvidia
    environment:
      DEVICE: cuda
      DATA_ROOT: /data
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["uvicorn", "webapp:app", "--host", "0.0.0.0", "--port", "8080"]
